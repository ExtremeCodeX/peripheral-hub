name: Catalog metadata
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate metadata and offline fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/build-catalog.py --check
      - name: Stage JSON only
        if: github.event_name != 'pull_request' && vars.CATALOG_PUBLISH_BRANCH != '' && github.ref == format('refs/heads/{0}', vars.CATALOG_PUBLISH_BRANCH) && github.ref_protected
        run: |
          stage="$(mktemp -d "$RUNNER_TEMP/catalog-pages.XXXXXX")"
          python3 tools/build-catalog.py --output "$stage/v1/index.json"
          echo "CATALOG_PAGES_DIR=$stage" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && vars.CATALOG_PUBLISH_BRANCH != '' && github.ref == format('refs/heads/{0}', vars.CATALOG_PUBLISH_BRANCH) && github.ref_protected
        with:
          path: ${{ env.CATALOG_PAGES_DIR }}
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && vars.CATALOG_PUBLISH_BRANCH != '' && github.ref == format('refs/heads/{0}', vars.CATALOG_PUBLISH_BRANCH) && github.ref_protected
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy after required human environment approval
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
