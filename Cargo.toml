[workspace]
resolver = "3"
members = ["crates/device-sdk", "crates/device-registry", "crates/core", "crates/transport-hid", "crates/ipc", "apps/daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
peripheral-hub-device-sdk = { path = "crates/device-sdk" }
peripheral-hub-device-registry = { path = "crates/device-registry" }
peripheral-hub-core = { path = "crates/core" }
peripheral-hub-transport-hid = { path = "crates/transport-hid" }
peripheral-hub-ipc = { path = "crates/ipc" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
interprocess = { version = "2.4", features = ["tokio"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
