[package]
name = "peripheral-hub-ipc"
description = "Versioned same-user local Peripheral Hub IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
peripheral-hub-device-sdk.workspace = true
peripheral-hub-profiles.workspace = true
peripheral-hub-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user", "fs"] }

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
widestring = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
